name: Build Self Schedule Planner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create Android project
        run: |
          mkdir -p SelfSchedulePlanner/app/src/main/java/com/example/selfscheduleplanner
          mkdir -p SelfSchedulePlanner/app/src/main/res/values

          cd SelfSchedulePlanner

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SelfSchedulePlanner"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.selfscheduleplanner"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.selfscheduleplanner"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.compose.ui:ui:1.7.8")
              implementation("androidx.compose.ui:ui-tooling-preview:1.7.8")
              implementation("androidx.compose.material3:material3:1.3.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/Theme.SelfSchedulePlanner"
                  android:label="Self Schedule Planner"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="Theme.SelfSchedulePlanner"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/example/selfscheduleplanner/MainActivity.kt <<'EOF'
          package com.example.selfscheduleplanner

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          data class Task(
              val id: Int,
              val title: String,
              val time: String,
              val completed: Boolean = false,
              val note: String = "",
              val friend: String = ""
          )

          data class Note(
              val id: Int,
              val title: String,
              val body: String
          )

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      MaterialTheme {
                          PlannerApp()
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun PlannerApp() {

              var tab by remember {
                  mutableIntStateOf(0)
              }

              var showAdd by remember {
                  mutableStateOf(false)
              }

              var title by remember {
                  mutableStateOf("")
              }

              var time by remember {
                  mutableStateOf("")
              }

              var tasks by remember {
                  mutableStateOf(
                      listOf(
                          Task(
                              1,
                              "Polity Revision",
                              "07:00 - 09:00",
                              true
                          ),

                          Task(
                              2,
                              "GS Answer Writing",
                              "10:00 - 13:00",
                              false,
                              "Federalism - 250 words",
                              "Ashish"
                          ),

                          Task(
                              3,
                              "Hindi Optional",
                              "14:00 - 16:00"
                          ),

                          Task(
                              4,
                              "CSAT Practice",
                              "17:00 - 19:00"
                          )
                      )
                  )
              }

              val notes = listOf(
                  Note(
                      1,
                      "Federalism",
                      "Cooperative and competitive federalism. Add recent examples."
                  ),

                  Note(
                      2,
                      "CSAT",
                      "Focus on comprehension, reasoning and basic numeracy."
                  ),

                  Note(
                      3,
                      "Environment",
                      "Revise biodiversity, climate change and conventions."
                  )
              )

              val completed = tasks.count {
                  it.completed
              }

              val progress =
                  if (tasks.isEmpty()) 0f
                  else completed.toFloat() / tasks.size

              Scaffold(

                  topBar = {
                      TopAppBar(
                          title = {
                              Text("Self Schedule Planner")
                          }
                      )
                  },

                  bottomBar = {

                      NavigationBar {

                          listOf(
                              "Today",
                              "Schedule",
                              "Notes",
                              "Friends"
                          ).forEachIndexed { index, name ->

                              NavigationBarItem(

                                  selected = tab == index,

                                  onClick = {
                                      tab = index
                                  },

                                  icon = {
                                      Text(
                                          listOf(
                                              "⌂",
                                              "◷",
                                              "▤",
                                              "♟"
                                          )[index]
                                      )
                                  },

                                  label = {
                                      Text(name)
                                  }
                              )
                          }
                      }
                  },

                  floatingActionButton = {

                      if (tab == 0 || tab == 1) {

                          FloatingActionButton(
                              onClick = {
                                  showAdd = true
                              }
                          ) {
                              Text("+")
                          }
                      }
                  }

              ) { padding ->

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(16.dp)
                  ) {

                      when (tab) {

                          0, 1 -> {

                              Text(
                                  if (tab == 0)
                                      "Today's Plan"
                                  else
                                      "Daily Schedule",

                                  style =
                                      MaterialTheme.typography
                                          .headlineMedium
                              )

                              Spacer(
                                  Modifier.height(12.dp)
                              )

                              if (tab == 0) {

                                  LinearProgressIndicator(
                                      progress = {
                                          progress
                                      },

                                      modifier =
                                          Modifier.fillMaxWidth()
                                  )

                                  Spacer(
                                      Modifier.height(6.dp)
                                  )

                                  Text(
                                      "$completed / ${tasks.size} tasks completed"
                                  )

                                  Spacer(
                                      Modifier.height(16.dp)
                                  )
                              }

                              LazyColumn(
                                  verticalArrangement =
                                      Arrangement.spacedBy(10.dp)
                              ) {

                                  items(tasks) { task ->

                                      Card(
                                          Modifier.fillMaxWidth()
                                      ) {

                                          Row(
                                              Modifier.padding(14.dp)
                                          ) {

                                              Column(
                                                  Modifier.weight(1f)
                                              ) {

                                                  Text(
                                                      task.title,
                                                      style =
                                                          MaterialTheme
                                                              .typography
                                                              .titleMedium
                                                  )

                                                  Text(task.time)

                                                  if (
                                                      task.note.isNotBlank()
                                                  ) {

                                                      Text(
                                                          "Note: ${task.note}"
                                                      )
                                                  }

                                                  if (
                                                      task.friend.isNotBlank()
                                                  ) {

                                                      Text(
                                                          "Friend: ${task.friend}"
                                                      )
                                                  }
                                              }

                                              Checkbox(

                                                  checked =
                                                      task.completed,

                                                  onCheckedChange = {

                                                      tasks =
                                                          tasks.map {

                                                              if (
                                                                  it.id ==
                                                                  task.id
                                                              ) {

                                                                  it.copy(
                                                                      completed =
                                                                          !it.completed
                                                                  )

                                                              } else {
                                                                  it
                                                              }
                                                          }
                                                  }
                                              )
                                          }
                                      }
                                  }
                              }
                          }

                          2 -> {

                              Text(
                                  "My Notes",
                                  style =
                                      MaterialTheme.typography
                                          .headlineMedium
                              )

                              Spacer(
                                  Modifier.height(12.dp)
                              )

                              LazyColumn(
                                  verticalArrangement =
                                      Arrangement.spacedBy(10.dp)
                              ) {

                                  items(notes) { note ->

                                      Card(
                                          Modifier.fillMaxWidth()
                                      ) {

                                          Column(
                                              Modifier.padding(16.dp)
                                          ) {

                                              Text(
                                                  note.title,
                                                  style =
                                                      MaterialTheme
                                                          .typography
                                                          .titleLarge
                                              )

                                              Spacer(
                                                  Modifier.height(6.dp)
                                              )

                                              Text(note.body)
                                          }
                                      }
                                  }
                              }
                          }

                          3 -> {

                              Text(
                                  "Friends",
                                  style =
                                      MaterialTheme.typography
                                          .headlineMedium
                              )

                              Spacer(
                                  Modifier.height(12.dp)
                              )

                              Card(
                                  Modifier.fillMaxWidth()
                              ) {

                                  Column(
                                      Modifier.padding(16.dp)
                                  ) {

                                      Text(
                                          "Ashish",
                                          style =
                                              MaterialTheme
                                                  .typography
                                                  .titleLarge
                                      )

                                      Text(
                                          "Shared task: GS Answer Writing"
                                      )

                                      Spacer(
                                          Modifier.height(10.dp)
                                      )

                                      Button(
                                          onClick = {}
                                      ) {

                                          Text(
                                              "Invite Friend"
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              if (showAdd) {

                  AlertDialog(

                      onDismissRequest = {
                          showAdd = false
                      },

                      title = {
                          Text("Add New Task")
                      },

                      text = {

                          Column {

                              OutlinedTextField(
                                  value = title,
                                  onValueChange = {
                                      title = it
                                  },

                                  label = {
                                      Text("Task name")
                                  }
                              )

                              Spacer(
                                  Modifier.height(8.dp)
                              )

                              OutlinedTextField(
                                  value = time,
                                  onValueChange = {
                                      time = it
                                  },

                                  label = {
                                      Text("Time")
                                  }
                              )
                          }
                      },

                      confirmButton = {

                          Button(

                              onClick = {

                                  if (title.isNotBlank()) {

                                      val newId =
                                          (tasks.maxOfOrNull {
                                              it.id
                                          } ?: 0) + 1

                                      tasks =
                                          tasks +
                                              Task(
                                                  newId,
                                                  title,
                                                  time.ifBlank {
                                                      "Any time"
                                                  }
                                              )

                                      title = ""
                                      time = ""
                                      showAdd = false
                                  }
                              }

                          ) {

                              Text("Add")
                          }
                      },

                      dismissButton = {

                          TextButton(
                              onClick = {
                                  showAdd = false
                              }
                          ) {

                              Text("Cancel")
                          }
                      }
                  )
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        working-directory: SelfSchedulePlanner
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SelfSchedulePlanner-APK
          path: SelfSchedulePlanner/app/build/outputs/apk/debug/app-debug.apk
